<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle with brand gradient -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#brandGradient)" filter="url(#dropShadow)"/>
  
  <!-- Car silhouette with water drop -->
  <g fill="white" transform="translate(60, 60) scale(0.65)">
    <!-- Car body -->
    <path d="M-25 10 L-25 -15 L-10 -25 L10 -25 L25 -15 L25 10 Z" fill="white"/>
    <!-- Windows -->
    <path d="M-22 -5 L-22 -20 L-3 -20 L-3 -5 Z" fill="url(#brandGradient)"/>
    <path d="M3 -5 L3 -20 L18 -20 L18 -5 Z" fill="url(#brandGradient)"/>
    <!-- Wheels -->
    <circle cx="-18" cy="12" r="5" fill="white" opacity="0.9"/>
    <circle cx="18" cy="12" r="5" fill="white" opacity="0.9"/>
    <!-- Water drop on car roof -->
    <path d="M0 -30 Q-6 -38 0 -44 Q6 -38 0 -30 Z" fill="#38bdf8"/>
    <circle cx="0" cy="-38" r="2" fill="white"/>
  </g>
  
  <!-- Alternative: CNH Monogram -->
  <!--
  <text x="60" y="72" text-anchor="middle" fill="white" font-size="36" font-weight="800" font-family="Inter, system-ui, sans-serif" letter-spacing="-2">
    CNH
  </text>
  -->
</svg>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hors connexion | CNH Service</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ea5e9'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='bold' font-family='Arial'>C</text></svg>">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(160deg,#0b1220,#0c2c47 55%,#075985);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
        .box{max-width:420px;width:100%}
        .logo{width:84px;height:84px;margin:0 auto 24px;border-radius:22px;background:linear-gradient(135deg,#0ea5e9,#0369a1);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(2,6,23,.45)}
        .logo svg{width:52px;height:52px}
        h1{font-size:1.5rem;font-weight:800;margin-bottom:10px}
        p{color:rgba(255,255,255,.75);font-size:.95rem;line-height:1.7;margin-bottom:28px}
        button{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;padding:14px 32px;border-radius:50px;font-family:'Inter',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;box-shadow:0 4px 14px rgba(14,165,233,.35);transition:transform .3s ease,box-shadow .3s ease}
        button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,165,233,.45)}
        .hint{margin-top:22px;font-size:.8rem;color:rgba(255,255,255,.5)}
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 32V16h4v12h8v4H12z" fill="white"/>
                <path d="M26 32V16l10 8-10 8z" fill="white" opacity=".85"/>
                <circle cx="36" cy="14" r="3" fill="#7dd3fc"/>
            </svg>
        </div>
        <h1>Vous êtes actuellement hors connexion</h1>
        <p>CNH Service n'arrive pas à joindre le serveur. Vérifiez votre connexion internet (Wi-Fi ou données mobiles), puis réessayez.</p>
        <button onclick="location.reload()"><i>↻</i> Réessayer</button>
        <p class="hint">Les réservations et formulaires nécessitent une connexion active.</p>
    </div>
</body>
</html>

# ── CNH Service — Nginx reverse proxy (sample) ───────────────────
# Place in /etc/nginx/sites-available/cnhservice and symlink into
# /etc/nginx/sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
#
# The Node app (PM2) listens on 127.0.0.1:3000. Nginx terminates TLS and
# proxies everything else. Static files are served by Express itself, so no
# extra root/location config is required.

server {
    listen 80;
    listen [::]:80;
    server_name cnhservice.com www.cnhservice.com;

    # Allow review/photo uploads if you increase Express' JSON limit later
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Optional: compress text assets proxied from Express
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── HTTPS (recommended) ────────────────────────────────────────
    # Run once:  sudo certbot --nginx -d cnhservice.com -d www.cnhservice.com
    # Certbot will add a `listen 443 ssl;` block and redirects here automatically.
}
